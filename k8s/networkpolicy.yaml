apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reports-ingress
  namespace: reports
spec:
  podSelector:
    matchLabels:
      app: reports
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: 8080
